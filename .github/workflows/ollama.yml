name: Ollama

on:
  push:
    branches:
      - renovate/**
  pull_request:
    paths:
      - "**"
      - "!.github/workflows/**"
      - ".github/workflows/ollama.yml"
      - "!.claude/**"
      - "!**.md"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE: remote:rw
  TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-test:
    timeout-minutes: 10
    name: Ollama Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Setup Claude
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Test Ollama
        run: ollama launch claude --model qwen3.5 --yes -- -p "how does this repository work?"
