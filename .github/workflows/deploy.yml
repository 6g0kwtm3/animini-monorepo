name: Deploy

on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE: remote:rw
  TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref_name != github.event.repository.default_branch && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-sentry:
    name: Deploy Sentry
    runs-on: ubuntu-latest
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm exec turbo --filter=@animedes/web build

      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: apps/web/dist
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm exec turbo --filter=@animedes/web build

      - name: Deploy
        run: pnpm exec wrangler pages deploy --branch=${BRANCH}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9b0348e83d33e46fbb82c3271317d70
          BRANCH: ${{ github.head_ref || github.ref_name  }}

  stryker:
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check
        run: pnpm exec turbo check

      - name: Cache Incremental
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
          enableCrossOsArchive: true

      - name: Coverage
        run: pnpm exec turbo stryker
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_KEY }}

  bundlewatch:
    runs-on: ubuntu-latest

    name: Bundlewatch
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm exec turbo --filter=@animedes/web build

      - name: Bundlewatch
        uses: relative-ci/agent-action@fcf45416581928e8dd62eded78ce98c78e5149f8
        with:
          key: ${{ secrets.RELATIVE_CI_KEY }}
          webpackStatsFile: ./apps/web/dist/client/webpack-stats.json

  test-e2e:
    name: Test E2E
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        project: [web, electron]
        include:
          - os: macos-latest
            project: electron
          - os: windows-latest
            project: electron

    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check affected — test-e2e
        id: affected-test-e2e
        continue-on-error: true
        run: pnpm exec turbo query affected --tasks test-e2e --exit-code

      - name: Install playwright 📦
        if: steps.affected-test-e2e.outcome == 'failure'
        uses: $/.github/actions/playwright-install
        timeout-minutes: 5

      - name: Install xvfb 📦
        if: steps.affected-test-e2e.outcome == 'failure' && github.ref_name != github.event.repository.default_branch && matrix.os == 'ubuntu-latest' && matrix.project == 'electron'
        run: sudo apt install -y xvfb

      - name: Test E2E
        if: steps.affected-test-e2e.outcome == 'failure' && github.ref_name != github.event.repository.default_branch
        run: ${{ matrix.os == 'ubuntu-latest' && matrix.project == 'electron' && 'xvfb-run --auto-servernum' || '' }} pnpm -w test-e2e -- --project=${{ matrix.project }}*
        env:
          ELECTRON_DISABLE_SANDBOX: 1
          DISPLAY: ":99.0"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
