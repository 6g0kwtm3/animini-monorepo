name: Deploy

on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE: remote:rw
  TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref_name != github.event.repository.default_branch && github.ref || github.run_id }}
  # jactionlint ignore=concurrency-cancels-release
  cancel-in-progress: true

jobs:
  deploy-sentry:
    timeout-minutes: 10
    name: Deploy Sentry
    runs-on: ubuntu-latest
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check affected — build
        id: affected-build
        continue-on-error: true
        run: pnpm exec turbo query affected --packages @animedes/web --tasks build --exit-code

      - name: Build
        if: steps.affected-build.outcome == 'failure'
        run: pnpm exec turbo --filter=@animedes/web build

      - name: Create Sentry release
        if: steps.affected-build.outcome == 'failure'
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: ${{ github.ref_name != github.event.repository.default_branch && 'preview' || 'production' }}
          sourcemaps: apps/web/dist
  deploy:
    timeout-minutes: 10
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      url: ${{ steps.deploy.outputs.url }}
      name: ${{ github.ref_name != github.event.repository.default_branch && 'web-preview' || 'web-production' }}
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check affected — deploy
        id: affected-deploy
        continue-on-error: true
        run: pnpm exec turbo query affected --packages @animedes/web --tasks deploy --exit-code

      - name: Deploy
        if: steps.affected-deploy.outcome == 'failure'
        id: deploy
        shell: bash
        run: |
          pnpm exec turbo --filter=@animedes/web deploy -- --branch="${BRANCH}"
          url=$(jq -r 'select(.type == "pages-deploy") | .url' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          [ -n "$url" ] && echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          VITE_SENTRY_MODE: ${{ github.ref_name != github.event.repository.default_branch && 'preview' || 'production' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9b0348e83d33e46fbb82c3271317d70
          BRANCH: ${{ github.head_ref || github.ref_name  }}

  deploy-flags:
    timeout-minutes: 10
    name: Deploy Flags
    runs-on: ubuntu-latest
    environment:
      url: ${{ steps.deploy.outputs.url }}
      name: ${{ github.ref_name != github.event.repository.default_branch && 'flags-preview' || 'flags-production' }}
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check affected — deploy
        id: affected-deploy
        continue-on-error: true
        run: pnpm exec turbo query affected --packages web-flags --tasks deploy --exit-code

      - name: Deploy
        if: steps.affected-deploy.outcome == 'failure'
        id: deploy
        shell: bash
        run: |
          if [ "${VITE_SENTRY_MODE}" = "production" ]; then
            pnpm exec turbo --filter=web-flags deploy
            filter='select(.type == "deploy") | .targets[0]'
          else
            pnpm --filter=web-flags exec wrangler preview --name "${BRANCH}"
            filter='select(.type == "preview") | (.preview_urls[0] // .deployment_urls[0] // empty)'
          fi
          url=$(jq -r "$filter" "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          [ -n "$url" ] && echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          VITE_SENTRY_MODE: ${{ github.ref_name != github.event.repository.default_branch && 'preview' || 'production' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9b0348e83d33e46fbb82c3271317d70
          BRANCH: ${{ github.head_ref || github.ref_name  }}

  stryker:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Incremental
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
          enableCrossOsArchive: true

      - name: Coverage
        run: pnpm exec turbo stryker
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_KEY }}

  bundlewatch:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    name: Bundlewatch
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check affected — build
        id: affected-build
        continue-on-error: true
        run: pnpm exec turbo query affected --packages @animedes/web --tasks build --exit-code

      - name: Build
        run: pnpm exec turbo --filter=@animedes/web build
        if: steps.affected-build.outcome == 'failure'

      - name: Bundlewatch
        uses: relative-ci/agent-action@fcf45416581928e8dd62eded78ce98c78e5149f8
        if: steps.affected-build.outcome == 'failure'
        with:
          key: ${{ secrets.RELATIVE_CI_KEY }}
          webpackStatsFile: ./apps/web/dist/client/webpack-stats.json

  test-e2e:
    timeout-minutes: 15
    name: Test E2E
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        project: [web, electron]
        include:
          - os: macos-latest
            project: electron
          - os: windows-latest
            project: electron

    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies 📦
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Check affected — test-e2e
        id: affected-test-e2e
        continue-on-error: true
        run: pnpm exec turbo query affected --tasks test-e2e --exit-code

      - name: Install playwright 📦
        if: steps.affected-test-e2e.outcome == 'failure'
        uses: $/.github/actions/playwright-install
        timeout-minutes: 5
        with:
          with-deps: ${{ steps.affected-test-e2e.outcome == 'failure' && github.ref_name != github.event.repository.default_branch }}

      - name: Install electron 📦
        if: steps.affected-test-e2e.outcome == 'failure' && github.ref_name != github.event.repository.default_branch && matrix.project == 'electron'
        run: pnpm --filter=web exec install-electron

      - name: Install xvfb 📦
        if: steps.affected-test-e2e.outcome == 'failure' && github.ref_name != github.event.repository.default_branch && matrix.project == 'electron' && matrix.os == 'ubuntu-latest'
        run: sudo apt install -y xvfb

      - name: Test E2E
        if: steps.affected-test-e2e.outcome == 'failure' && github.ref_name != github.event.repository.default_branch
        run: ${{ matrix.os == 'ubuntu-latest' && matrix.project == 'electron' && 'xvfb-run --auto-servernum' || '' }} pnpm -w test-e2e -- --project=${{ matrix.project }}*
        env:
          ELECTRON_DISABLE_SANDBOX: 1
          DISPLAY: ":99.0"
          VITE_SENTRY_MODE: e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
